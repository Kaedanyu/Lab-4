<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGR472 Lab 4</title>
    <!-- mapbox API -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css' rel='stylesheet' />
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Turf.js -->
    <script src='https://unpkg.com/@turf/turf@7.2.0/turf.min.js'></script>
</head>

<body>

    <!-- Map container -->
    <div id='map' class='map'></div>

    <!-- Legend -->
    <div id="collision-legend" class="gradient-legend">
        <h4>Pedestrian & Cyclist Collisions</h4>
        <div class="gradient-bar"></div>
        <!-- Labels -->
        <div class="gradient-labels" id="legend-labels">
            <!-- Label values based on % of max hexagon values -->
            <span id="val-0">0</span> 
            <span id="val-25">25%</span>
            <span id="val-50">50%</span>
            <span id="val-75">75%</span>
            <span id="val-100">Max</span>
        </div>
        <!-- Axis title -->
        <div class="axis-title">
            Collision count per hexagon
        </div>

        <!-- Toggle control -->
        <div class="layer-toggle">
            <label>
                <input type="checkbox" id="hexgrid-toggle" checked>
                Show/Hide Data
            </label>
        </div>
    </div>
    <!-- Info box -->
    <div id="info-box" class="info-box">
        <body>
            This map shows the number of road collisions involving pedestrians and cyclists with data between 2006 and 2021 in Toronto.
        </body>
        <div id="name" class="name">
            <body>
                Created by Kaedan Yu
            </body>
        </div> 
    </div>


    <script src="script.js"></script>

</body>

</html>
